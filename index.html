<!DOCTYPE html>

<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1">

<title>Приймання компонентів крові</title>

<style>
  
body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    Arial,
    sans-serif;

  background: #f2f2f7;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 650px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 14px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  color: #666;
  font-size: 13px;
  margin-top: 13px;
  margin-bottom: 4px;
}

input,
select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;

  font-size: 17px;

  border:
    1px solid #ccc;

  border-radius: 9px;

  background: white;
}

button {
  width: 100%;
  padding: 15px;

  border: none;
  border-radius: 10px;

  font-size: 18px;

  margin-top: 12px;
}

.success {
  background: #188038;
  color: white;
}

#preview {
  display: none;

  width: 100%;
  margin-top: 12px;

  border-radius: 10px;
}

#status {
  margin-top: 12px;
  font-weight: 600;
}

.ok {
  color: #188038;
}

.warning {
  color: #b3261e;
}

.small {
  color: #777;
  font-size: 13px;
}

</style>

</head>


<body>


<button
  style="
    background:#555;
    color:white;
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    margin-top:12px;
  "
  onclick="sendToBackend({action:'ping'})">
  ТЕСТ ЗВʼЯЗКУ З APPS SCRIPT
</button>
  
<div class="container">


<div class="card">

<h2>
Приймання компонента крові
</h2>

<p class="small">
Сфотографуй основну етикетку максимально рівно.
</p>

<input
  id="photo"
  type="file"
  accept="image/*"
  capture="environment"
  onchange="handlePhoto(event)">

<img id="preview">

<div id="status">
Очікую фотографію
</div>

</div>


<div
class="card"
id="fieldsCard"
style="display:none">

<label>
Компонент
</label>

<input id="component">


<label>
Код компонента
</label>

<input id="componentCode">

  
<label>
Ціна, грн
</label>

<input id="price">

  
<label>
ID дози
</label>

<input id="doseId">


<label>
ABO
</label>

<select id="abo">

<option value="">
—
</option>

<option>
O(I)
</option>

<option>
A(II)
</option>

<option>
B(III)
</option>

<option>
AB(IV)
</option>

</select>


<label>
RhD
</label>

<select id="rh">

<option value="">
—
</option>

<option>
RhD+
</option>

<option>
RhD-
</option>

</select>


<label>
Kell
</label>

<select id="kell">

<option value="">
—
</option>

<option>
Kell+
</option>

<option>
Kell-
</option>

</select>


<label>
Фенотип
</label>

<input id="phenotype">


<label>
Обʼєм
</label>

<input id="volume">


<label>
Дата заготівлі
</label>

<input id="collectionDate">


<label>
Термін придатності
</label>

<input id="expiryDate">


<label>
Антикоагулянт
</label>

<input id="anticoagulant">


<label>
Додатковий розчин
</label>

<input id="additiveSolution">


<button
class="success"
onclick="submitDose()">

Підтвердити приймання

</button>

</div>


<iframe
name="backendFrame"
id="backendFrame"
style="display:none">
</iframe>


<form
id="backendForm"
method="POST"
target="backendFrame"
style="display:none">
</form>


</div>


<script>

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbwyBrLB_cT7qJsSQK-3LYwZYTO5jvxhgmiN30ddWzhxfvq4mE2ka5uuaEtwq97cIHzm/exec';


let rawOCR = '';


// ========================================
// PHOTO
// ========================================



async function handlePhoto(e) {

  const file =
    e.target.files[0];

  if (!file) {
    return;
  }


  setStatus(
    'Готую фотографію...',
    ''
  );


  const dataUrl =
    await resizeImage(file);


  const preview =
    document.getElementById(
      'preview'
    );

  preview.src =
    dataUrl;

  preview.style.display =
    'block';


  const base64 =
    dataUrl.split(',')[1];


  setStatus(
    'Розпізнаю етикетку...',
    ''
  );


  const requestId =
  Date.now().toString() +
  '_' +
  Math.random()
    .toString(36)
    .slice(2);

sendToBackend({

  action:
    'ocr',

  requestId:
    requestId,

  imageBase64:
    base64

});

pollOcrResult(
  requestId
);

}



// ========================================
// IMAGE RESIZE
// ========================================

function resizeImage(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          const img =
            new Image();


          img.onload =
            function() {

              const maxSide =
                1600;


              let width =
                img.width;

              let height =
                img.height;


              if (
                width > maxSide ||
                height > maxSide
              ) {

                const scale =
                  Math.min(
                    maxSide / width,
                    maxSide / height
                  );


                width =
                  Math.round(
                    width * scale
                  );


                height =
                  Math.round(
                    height * scale
                  );

              }


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  '2d'
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  0.85
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );
}



// ========================================
// BACKEND FORM
// ========================================

function sendToBackend(values) {

  const form =
    document.getElementById(
      'backendForm'
    );


  form.innerHTML =
    '';


  form.action =
    APPS_SCRIPT_URL;


  Object.keys(values)
    .forEach(key => {

      const input =
        document.createElement(
          'input'
        );


      input.type =
        'hidden';

      input.name =
        key;

      input.value =
        values[key];


      form.appendChild(
        input
      );

    });


  form.submit();
}




// ========================================
// FILL FIELDS
// ========================================

function fillFields(d) {

  const ids = [

    'component',
    'doseId',
    'componentCode'
    'price'
    'abo',
    'rh',
    'phenotype',
    'kell',
    'volume',
    'collectionDate',
    'expiryDate',
    'anticoagulant',
    'additiveSolution'

  ];


  ids.forEach(id => {

    document
      .getElementById(id)
      .value =
        d[id] || '';

  });

}


let pollTimer = null;


function pollOcrResult(requestId) {

  let attempts = 0;

  if (pollTimer) {
    clearInterval(pollTimer);
  }

  pollTimer =
    setInterval(() => {

      attempts++;

      if (attempts > 60) {

        clearInterval(
          pollTimer
        );

        setStatus(
          '❌ Не отримано відповідь від OCR.',
          'warning'
        );

        return;
      }

      const old =
        document.getElementById(
          'jsonpRequest'
        );

      if (old) {
        old.remove();
      }

      const script =
        document.createElement(
          'script'
        );

      script.id =
        'jsonpRequest';

      script.src =
        APPS_SCRIPT_URL +
        '?action=status' +
        '&requestId=' +
        encodeURIComponent(requestId) +
        '&callback=handleOcrStatus' +
        '&t=' +
        Date.now();

      document.body
        .appendChild(script);

    }, 1000);
}


function handleOcrStatus(msg) {

  if (!msg) {
    return;
  }

  if (msg.pending) {
    return;
  }

  if (pollTimer) {

    clearInterval(
      pollTimer
    );

    pollTimer = null;
  }

  if (!msg.ok) {

    setStatus(
      '❌ ' +
      (
        msg.error ||
        'Помилка OCR'
      ),
      'warning'
    );

    return;
  }

  rawOCR =
    msg.rawText || '';

  fillFields(
    msg.data || {}
  );

  document
    .getElementById(
      'fieldsCard'
    )
    .style.display =
      'block';

  setStatus(
    '✅ Розпізнано. Перевір усі поля.',
    'ok'
  );
}

  
let savePollTimer = null;


function pollSaveResult(requestId) {

  let attempts = 0;

  if (savePollTimer) {
    clearInterval(savePollTimer);
  }

  savePollTimer =
    setInterval(() => {

      attempts++;

      if (attempts > 30) {

        clearInterval(
          savePollTimer
        );

        setStatus(
          '❌ Не отримано підтвердження збереження.',
          'warning'
        );

        return;
      }

      const old =
        document.getElementById(
          'jsonpSaveRequest'
        );

      if (old) {
        old.remove();
      }

      const script =
        document.createElement(
          'script'
        );

      script.id =
        'jsonpSaveRequest';

      script.src =
        APPS_SCRIPT_URL +
        '?action=saveStatus' +
        '&requestId=' +
        encodeURIComponent(requestId) +
        '&callback=handleSaveStatus' +
        '&t=' +
        Date.now();

      document.body
        .appendChild(script);

    }, 1000);
}


function handleSaveStatus(msg) {

  if (!msg) {
    return;
  }

  if (msg.pending) {
    return;
  }

  if (savePollTimer) {

    clearInterval(
      savePollTimer
    );

    savePollTimer = null;
  }

  if (!msg.ok) {

    setStatus(
      '❌ ' +
      (
        msg.error ||
        'Помилка збереження'
      ),
      'warning'
    );

    return;
  }

  setStatus(
    '✅ Дозу ' +
    msg.doseId +
    ' прийнято та записано.',
    'ok'
  );

  alert(
    'Дозу успішно прийнято'
  );
}  

// ========================================
// SAVE
// ========================================

function submitDose() {

  const doseId =
    valueOf('doseId');

  if (!doseId) {
    alert('Перевір ID дози.');
    return;
  }

  const requestId =
    Date.now().toString() +
    '_' +
    Math.random()
      .toString(36)
      .slice(2);

  setStatus(
    'Зберігаю дозу...',
    ''
  );

  sendToBackend({

    action: 'save',

    requestId: requestId,

    doseId: doseId,

    component:
      valueOf('component'),
    
    componentCode:
      valueOf('componentCode'),

    price:
      valueOf('price'),
    
    abo:
      valueOf('abo'),

    rh:
      valueOf('rh'),

    phenotype:
      valueOf('phenotype'),

    kell:
      valueOf('kell'),

    volume:
      valueOf('volume'),

    collectionDate:
      valueOf('collectionDate'),

    expiryDate:
      valueOf('expiryDate'),

    anticoagulant:
      valueOf('anticoagulant'),

    additiveSolution:
      valueOf('additiveSolution'),

    rawText:
      rawOCR
  });

  pollSaveResult(
    requestId
  );
}


// ========================================
// HELPERS
// ========================================

function valueOf(id) {

  return document
    .getElementById(id)
    .value
    .trim();
}


function setStatus(
  text,
  className
) {

  const el =
    document.getElementById(
      'status'
    );


  el.textContent =
    text;


  el.className =
    className || '';

}

</script>


</body>

</html>
