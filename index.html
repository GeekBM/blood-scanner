<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Сканер компонентів крові</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 16px;
    }

    .card {
      max-width: 600px;
      margin: 0 auto 16px auto;
      background: white;
      padding: 16px;
      border-radius: 12px;
    }

    h2 {
      margin-top: 0;
    }

    input {
      font-size: 18px;
      width: 100%;
    }

    img {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
    }

    #result {
      font-size: 22px;
      font-weight: 600;
      word-break: break-all;
      margin-top: 10px;
    }

    #status {
      margin-top: 10px;
      color: #666;
    }

    .hint {
      font-size: 14px;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Сканер компонентів крові</h2>

  <p class="hint">
    Сфотографуй один штрихкод крупним планом.
    У кадрі бажано залишити тільки сам штрихкод
    і невеликі поля навколо нього.
  </p>

  <input
    id="photo"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <img id="preview">

</div>


<div class="card">

  <div>Прочитаний код:</div>

  <div id="result">
    —
  </div>

  <div id="status">
    Очікую фотографію
  </div>

</div>


<script>

const codeReader =
  new ZXing.BrowserMultiFormatReader();

const input =
  document.getElementById("photo");

const preview =
  document.getElementById("preview");

const resultBox =
  document.getElementById("result");

const statusBox =
  document.getElementById("status");


input.addEventListener("change", async function () {

  if (!input.files || !input.files[0]) {
    return;
  }

  const file = input.files[0];

  const url =
    URL.createObjectURL(file);

  preview.src = url;
  preview.style.display = "block";

  resultBox.textContent = "—";
  statusBox.textContent =
    "Аналізую штрихкод...";


  preview.onload = async function () {

    try {

      const result =
        await codeReader.decodeFromImageElement(
          preview
        );

      resultBox.textContent =
        result.getText();

      let format = "";

      try {
        format =
          result.getBarcodeFormat().toString();
      } catch (e) {}

      statusBox.textContent =
        "Успішно. Формат: " + format;

      if (navigator.vibrate) {
        navigator.vibrate(150);
      }

    } catch (err) {

      console.log(err);

      statusBox.textContent =
        "Штрихкод не розпізнано. " +
        "Спробуй сфотографувати ближче, " +
        "рівніше та без відблиску.";
    }

  };

});

</script>

</body>
</html>
