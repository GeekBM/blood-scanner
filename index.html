const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwyBrLB_cT7qJsSQK-3LYwZYTO5jvxhgmiN30ddWzhxfvq4mE2ka5uuaEtwq97cIHzm/exec';
<!DOCTYPE html>

<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1">

<title>Приймання компонентів крові</title>

<style>

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    Arial,
    sans-serif;

  background: #f2f2f7;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 650px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 14px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  color: #666;
  font-size: 13px;
  margin-top: 13px;
  margin-bottom: 4px;
}

input,
select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;

  font-size: 17px;

  border:
    1px solid #ccc;

  border-radius: 9px;

  background: white;
}

button {
  width: 100%;
  padding: 15px;

  border: none;
  border-radius: 10px;

  font-size: 18px;

  margin-top: 12px;
}

.success {
  background: #188038;
  color: white;
}

#preview {
  display: none;

  width: 100%;
  margin-top: 12px;

  border-radius: 10px;
}

#status {
  margin-top: 12px;
  font-weight: 600;
}

.ok {
  color: #188038;
}

.warning {
  color: #b3261e;
}

.small {
  color: #777;
  font-size: 13px;
}

</style>

</head>


<body>

<div class="container">


<div class="card">

<h2>
Приймання компонента крові
</h2>

<p class="small">
Сфотографуй основну етикетку максимально рівно.
</p>

<input
id="photo"
type="file"
accept="image/*"
capture="environment">

<img id="preview">

<div id="status">
Очікую фотографію
</div>

</div>


<div
class="card"
id="fieldsCard"
style="display:none">

<label>
Компонент
</label>

<input id="component">


<label>
ID дози
</label>

<input id="doseId">


<label>
ABO
</label>

<select id="abo">

<option value="">
—
</option>

<option>
O(I)
</option>

<option>
A(II)
</option>

<option>
B(III)
</option>

<option>
AB(IV)
</option>

</select>


<label>
RhD
</label>

<select id="rh">

<option value="">
—
</option>

<option>
RhD+
</option>

<option>
RhD-
</option>

</select>


<label>
Kell
</label>

<select id="kell">

<option value="">
—
</option>

<option>
Kell+
</option>

<option>
Kell-
</option>

</select>


<label>
Фенотип
</label>

<input id="phenotype">


<label>
Обʼєм
</label>

<input id="volume">


<label>
Дата заготівлі
</label>

<input id="collectionDate">


<label>
Термін придатності
</label>

<input id="expiryDate">


<label>
Антикоагулянт
</label>

<input id="anticoagulant">


<label>
Додатковий розчин
</label>

<input id="additiveSolution">


<button
class="success"
onclick="submitDose()">

Підтвердити приймання

</button>

</div>


<iframe
name="backendFrame"
id="backendFrame"
style="display:none">
</iframe>


<form
id="backendForm"
method="POST"
target="backendFrame"
style="display:none">
</form>


</div>


<script>

const APPS_SCRIPT_URL =
  'ВСТАВ_СЮДИ_URL_APPS_SCRIPT_EXEC';


let rawOCR = '';


// ========================================
// PHOTO
// ========================================

document
.getElementById('photo')
.addEventListener(
  'change',
  handlePhoto
);


async function handlePhoto(e) {

  const file =
    e.target.files[0];

  if (!file) {
    return;
  }


  setStatus(
    'Готую фотографію...',
    ''
  );


  const dataUrl =
    await resizeImage(file);


  const preview =
    document.getElementById(
      'preview'
    );

  preview.src =
    dataUrl;

  preview.style.display =
    'block';


  const base64 =
    dataUrl.split(',')[1];


  setStatus(
    'Розпізнаю етикетку...',
    ''
  );


  sendToBackend({

    action:
      'ocr',

    imageBase64:
      base64

  });

}



// ========================================
// IMAGE RESIZE
// ========================================

function resizeImage(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          const img =
            new Image();


          img.onload =
            function() {

              const maxSide =
                1600;


              let width =
                img.width;

              let height =
                img.height;


              if (
                width > maxSide ||
                height > maxSide
              ) {

                const scale =
                  Math.min(
                    maxSide / width,
                    maxSide / height
                  );


                width =
                  Math.round(
                    width * scale
                  );


                height =
                  Math.round(
                    height * scale
                  );

              }


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  '2d'
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  0.85
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );
}



// ========================================
// BACKEND FORM
// ========================================

function sendToBackend(values) {

  const form =
    document.getElementById(
      'backendForm'
    );


  form.innerHTML =
    '';


  form.action =
    APPS_SCRIPT_URL;


  Object.keys(values)
    .forEach(key => {

      const input =
        document.createElement(
          'input'
        );


      input.type =
        'hidden';

      input.name =
        key;

      input.value =
        values[key];


      form.appendChild(
        input
      );

    });


  form.submit();
}



// ========================================
// RESPONSE FROM APPS SCRIPT
// ========================================

window.addEventListener(
  'message',
  function(event) {

    if (
      event.origin !==
      'https://script.google.com'
      &&
      !event.origin.endsWith(
        '.googleusercontent.com'
      )
    ) {

      return;
    }


    const msg =
      event.data;


    if (
      !msg ||
      typeof msg !== 'object'
    ) {

      return;
    }


    if (!msg.ok) {

      setStatus(
        '❌ ' +
        (
          msg.error ||
          'Помилка'
        ),
        'warning'
      );

      return;
    }


    if (
      msg.type ===
      'ocrResult'
    ) {

      rawOCR =
        msg.rawText || '';


      fillFields(
        msg.data || {}
      );


      document
        .getElementById(
          'fieldsCard'
        )
        .style.display =
        'block';


      setStatus(
        '✅ Розпізнано. Перевір усі поля.',
        'ok'
      );

    }


    if (
      msg.type ===
      'saveResult'
    ) {

      setStatus(
        '✅ Дозу ' +
        msg.doseId +
        ' записано.',
        'ok'
      );


      alert(
        'Дозу успішно прийнято'
      );

    }

  }
);



// ========================================
// FILL FIELDS
// ========================================

function fillFields(d) {

  const ids = [

    'component',
    'doseId',
    'abo',
    'rh',
    'phenotype',
    'kell',
    'volume',
    'collectionDate',
    'expiryDate',
    'anticoagulant',
    'additiveSolution'

  ];


  ids.forEach(id => {

    document
      .getElementById(id)
      .value =
        d[id] || '';

  });

}



// ========================================
// SAVE
// ========================================

function submitDose() {

  const doseId =
    valueOf(
      'doseId'
    );


  if (!doseId) {

    alert(
      'Перевір ID дози.'
    );

    return;
  }


  setStatus(
    'Зберігаю дозу...',
    ''
  );


  sendToBackend({

    action:
      'save',

    doseId:
      doseId,

    component:
      valueOf('component'),

    abo:
      valueOf('abo'),

    rh:
      valueOf('rh'),

    phenotype:
      valueOf('phenotype'),

    kell:
      valueOf('kell'),

    volume:
      valueOf('volume'),

    collectionDate:
      valueOf('collectionDate'),

    expiryDate:
      valueOf('expiryDate'),

    anticoagulant:
      valueOf('anticoagulant'),

    additiveSolution:
      valueOf('additiveSolution'),

    rawText:
      rawOCR

  });

}



// ========================================
// HELPERS
// ========================================

function valueOf(id) {

  return document
    .getElementById(id)
    .value
    .trim();
}


function setStatus(
  text,
  className
) {

  const el =
    document.getElementById(
      'status'
    );


  el.textContent =
    text;


  el.className =
    className || '';

}

</script>

</body>

</html>
