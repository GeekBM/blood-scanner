const VISION_API_KEY = '';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwyBrLB_cT7qJsSQK-3LYwZYTO5jvxhgmiN30ddWzhxfvq4mE2ka5uuaEtwq97cIHzm/exec';
<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1">

<title>Приймання компонентів крові</title>

<style>

body {
  font-family: -apple-system,
               BlinkMacSystemFont,
               Arial,
               sans-serif;

  background: #f2f2f7;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 650px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 14px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  color: #666;
  font-size: 13px;
  margin-top: 13px;
  margin-bottom: 4px;
}

input,
select {
  width: 100%;
  box-sizing: border-box;

  padding: 12px;

  font-size: 17px;

  border: 1px solid #ccc;
  border-radius: 9px;

  background: white;
}

button {
  width: 100%;

  padding: 15px;

  border: none;
  border-radius: 10px;

  font-size: 18px;

  margin-top: 10px;
}

.primary {
  background: #1976d2;
  color: white;
}

.success {
  background: #188038;
  color: white;
}

#preview {
  display: none;

  max-width: 100%;
  margin-top: 12px;

  border-radius: 10px;
}

#status {
  margin-top: 12px;
  font-weight: 600;
}

.warning {
  color: #b06000;
}

.ok {
  color: #188038;
}

.small {
  color: #777;
  font-size: 13px;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<h2>Приймання компонента крові</h2>

<p class="small">
Сфотографуй всю основну етикетку максимально рівно.
</p>

<input
  id="photo"
  type="file"
  accept="image/*"
  capture="environment">

<img id="preview">

<div id="status">
  Очікую фотографію
</div>

</div>


<div class="card" id="fieldsCard" style="display:none">

<label>Компонент</label>
<input id="component">

<label>ID дози</label>
<input id="doseId">

<label>ABO</label>
<select id="abo">
  <option value="">—</option>
  <option>O(I)</option>
  <option>A(II)</option>
  <option>B(III)</option>
  <option>AB(IV)</option>
</select>

<label>RhD</label>
<select id="rh">
  <option value="">—</option>
  <option>RhD+</option>
  <option>RhD-</option>
</select>

<label>Kell</label>
<select id="kell">
  <option value="">—</option>
  <option>Kell+</option>
  <option>Kell-</option>
</select>

<label>Фенотип</label>
<input id="phenotype">

<label>Обʼєм</label>
<input id="volume">

<label>Дата заготівлі</label>
<input id="collectionDate">

<label>Термін придатності</label>
<input id="expiryDate">

<label>Антикоагулянт</label>
<input id="anticoagulant">

<label>Додатковий розчин</label>
<input id="additiveSolution">

<button
  class="success"
  onclick="submitDose()">
  Підтвердити приймання
</button>

</div>

</div>


<script>

// =====================================================
// НАЛАШТУВАННЯ
// =====================================================

const VISION_API_KEY =
  'ВСТАВ_BROWSER_API_KEY';

const APPS_SCRIPT_URL =
  'ВСТАВ_URL_APPS_SCRIPT';


let rawOCR = '';


// =====================================================
// ФОТО
// =====================================================

document
  .getElementById('photo')
  .addEventListener(
    'change',
    handlePhoto
  );


async function handlePhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  const status =
    document.getElementById('status');

  status.textContent =
    'Готую фотографію...';

  const imageData =
    await resizeImage(file);

  document.getElementById('preview').src =
    imageData;

  document.getElementById('preview').style.display =
    'block';

  status.textContent =
    'Cloud Vision розпізнає етикетку...';

  try {

    const base64 =
      imageData.split(',')[1];

    const response =
      await fetch(
        'https://vision.googleapis.com/v1/images:annotate?key='
        + encodeURIComponent(VISION_API_KEY),

        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({

            requests: [

              {
                image: {
                  content: base64
                },

                features: [
                  {
                    type:
                      'TEXT_DETECTION'
                  }
                ],

                imageContext: {
                  languageHints: [
                    'uk',
                    'en'
                  ]
                }
              }

            ]

          })
        }
      );


    const json =
      await response.json();


    if (!response.ok) {

      throw new Error(
        json.error?.message ||
        'Cloud Vision error'
      );
    }


    rawOCR =
      json.responses?.[0]
          ?.textAnnotations?.[0]
          ?.description || '';


    if (!rawOCR) {

      throw new Error(
        'Текст на етикетці не знайдений'
      );
    }


    const data =
      parseBloodLabel(rawOCR);


    fillFields(data);


    document
      .getElementById('fieldsCard')
      .style.display =
      'block';


    status.textContent =
      '✅ Етикетку розпізнано. Перевір дані перед прийманням.';

    status.className =
      'ok';


  } catch (err) {

    console.error(err);

    status.textContent =
      '❌ ' + err.message;

    status.className =
      'warning';
  }
}



// =====================================================
// ЗМЕНШУЄМО ФОТО
// =====================================================

function resizeImage(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload = function(e) {

        const img =
          new Image();

        img.onload = function() {

          const maxSide = 1800;

          let width =
            img.width;

          let height =
            img.height;


          if (
            width > maxSide ||
            height > maxSide
          ) {

            const scale =
              Math.min(
                maxSide / width,
                maxSide / height
              );

            width =
              Math.round(
                width * scale
              );

            height =
              Math.round(
                height * scale
              );
          }


          const canvas =
            document.createElement(
              'canvas'
            );

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext('2d');


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              'image/jpeg',
              0.88
            )
          );
        };


        img.onerror =
          reject;


        img.src =
          e.target.result;
      };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );
}



// =====================================================
// ПАРСЕР
// =====================================================

function parseBloodLabel(text) {

  const r = {

    component: '',
    doseId: '',
    abo: '',
    rh: '',
    phenotype: '',
    kell: '',
    volume: '',
    collectionDate: '',
    expiryDate: '',
    anticoagulant: '',
    additiveSolution: ''

  };


  const flat =
    String(text || '')

      .replace(/\n/g, ' ')

      .replace(/\s+/g, ' ')

      .trim();


  // COMPONENT

  if (
    /еритроцит.*збіднен.*лейкоцит/i.test(flat)
  ) {

    r.component =
      'Еритроцити, збіднені на лейкоцити';

  }

  else if (
    /еритроцит/i.test(flat)
  ) {

    r.component =
      'Еритроцитарний компонент';

  }

  else if (
    /тромбоцит.*аферез/i.test(flat)
  ) {

    r.component =
      'Тромбоцити, аферез';

  }

  else if (
    /тромбоцит/i.test(flat)
  ) {

    r.component =
      'Тромбоцити';

  }

  else if (
    /плазм/i.test(flat)
  ) {

    r.component =
      'СЗП';

  }

  else if (
    /кріопрецип/i.test(flat)
  ) {

    r.component =
      'Кріопреципітат';

  }


  // ID

  const ids =
    flat.match(
      /\b\d{2}[.,]\d{2}[.,]\d{6,8}\b/g
    );

  if (ids?.length) {

    r.doseId =
      ids[ids.length - 1]
        .replace(/,/g, '.');
  }


  // ABO

  if (
    /\b(?:O|0)\s*\(\s*(?:I|1)\s*\)/i
      .test(flat)
  ) {

    r.abo = 'O(I)';

  }

  else if (
    /\bA\s*\(\s*(?:II|11)\s*\)/i
      .test(flat)
  ) {

    r.abo = 'A(II)';

  }

  else if (
    /\bB\s*\(\s*(?:III|111)\s*\)/i
      .test(flat)
  ) {

    r.abo = 'B(III)';

  }

  else if (
    /\bAB\s*\(\s*(?:IV|1V)\s*\)/i
      .test(flat)
  ) {

    r.abo = 'AB(IV)';

  }


  // RhD

  if (
    /rh\.?\s*(?:позит|positive|\+)/i
      .test(flat)
  ) {

    r.rh = 'RhD+';

  }

  else if (
    /rh\.?\s*(?:негат|negative|-)/i
      .test(flat)
  ) {

    r.rh = 'RhD-';

  }


  // Kell

  if (
    /kell[\s\-]*нег/i
      .test(flat)
  ) {

    r.kell =
      'Kell-';

  }

  else if (
    /kell[\s\-]*позит/i
      .test(flat)
  ) {

    r.kell =
      'Kell+';

  }


  // Phenotype

  const phenotype =
    flat.match(
      /\b[Cc]{1,2}[Dd]{1,2}[Ee]{1,2}\b/
    );

  if (phenotype) {

    r.phenotype =
      phenotype[0];

  }


  // Volume

  let volume =
    flat.match(
      /об['’ʼ]?\s*єм\s*[:\-]?\s*(\d{2,4})\s*мл/i
    );

  if (!volume) {

    volume =
      flat.match(
        /\b(\d{2,4})\s*мл\b/i
      );
  }

  if (volume) {

    r.volume =
      volume[1] +
      ' мл';

  }


  // Dates:
  // беремо дати після напису "Дата заготівлі"

  let dateSection =
    flat;

  const dateIndex =
    flat
      .toLowerCase()
      .indexOf(
        'дата заготівлі'
      );


  if (dateIndex >= 0) {

    dateSection =
      flat.substring(
        dateIndex
      );

  }


  const dates =
    extractDates(
      dateSection
    );


  if (dates.length > 0) {

    r.collectionDate =
      dates[0];

  }


  if (dates.length > 1) {

    r.expiryDate =
      dates[1];

  }


  // Anticoagulant

  const anti =
    flat.match(
      /антикоагулянт\s*[:\-]?\s*([A-ZА-ЯІЇЄҐ\-]{2,15})/i
    );

  if (anti) {

    r.anticoagulant =
      anti[1];

  }


  // Additive solution

  const additive =
    flat.match(
      /додатков(?:ий|ого)\s+розчин\s*[:\-]?\s*([A-ZА-ЯІЇЄҐ\-]{2,15})(?:\s+(\d{1,4})\s*мл)?/i
    );


  if (additive) {

    r.additiveSolution =
      additive[1];

    if (additive[2]) {

      r.additiveSolution +=
        ' ' +
        additive[2] +
        ' мл';

    }

  }


  return r;
}



function extractDates(text) {

  const found =
    String(text || '')
      .match(
        /\b\d{2}[.,]\d{2}[.,]\d{4}\b/g
      ) || [];


  const result = [];


  found.forEach(value => {

    const normalized =
      value.replace(/,/g, '.');


    const p =
      normalized.split('.');


    const day =
      Number(p[0]);

    const month =
      Number(p[1]);

    const year =
      Number(p[2]);


    if (
      day >= 1 &&
      day <= 31 &&
      month >= 1 &&
      month <= 12 &&
      year >= 2020 &&
      year <= 2100
    ) {

      if (
        !result.includes(
          normalized
        )
      ) {

        result.push(
          normalized
        );

      }
    }

  });


  return result;
}



// =====================================================
// ЗАПОВНЕННЯ ФОРМИ
// =====================================================

function fillFields(d) {

  const ids = [
    'component',
    'doseId',
    'abo',
    'rh',
    'phenotype',
    'kell',
    'volume',
    'collectionDate',
    'expiryDate',
    'anticoagulant',
    'additiveSolution'
  ];


  ids.forEach(id => {

    document
      .getElementById(id)
      .value =
      d[id] || '';

  });

}



// =====================================================
// ПІДТВЕРДЖЕННЯ
// =====================================================

function submitDose() {

  const doseId =
    document
      .getElementById('doseId')
      .value
      .trim();


  if (!doseId) {

    alert(
      'Перевір ID дози.'
    );

    return;
  }


  const fields = {

    doseId:
      doseId,

    component:
      document.getElementById('component').value,

    abo:
      document.getElementById('abo').value,

    rh:
      document.getElementById('rh').value,

    phenotype:
      document.getElementById('phenotype').value,

    kell:
      document.getElementById('kell').value,

    volume:
      document.getElementById('volume').value,

    collectionDate:
      document.getElementById('collectionDate').value,

    expiryDate:
      document.getElementById('expiryDate').value,

    anticoagulant:
      document.getElementById('anticoagulant').value,

    additiveSolution:
      document.getElementById('additiveSolution').value,

    rawText:
      rawOCR

  };


  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';

  form.action =
    APPS_SCRIPT_URL;

  form.target =
    '_blank';


  Object.keys(fields)
    .forEach(key => {

      const input =
        document.createElement(
          'input'
        );

      input.type =
        'hidden';

      input.name =
        key;

      input.value =
        fields[key];

      form.appendChild(
        input
      );

    });


  document.body
    .appendChild(
      form
    );


  form.submit();


  form.remove();
}

</script>

</body>
</html>
