<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>OCR компонентів крові</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 16px;
    }

    .card {
      max-width: 650px;
      margin: 0 auto 16px;
      background: white;
      padding: 16px;
      border-radius: 12px;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      font-size: 17px;
    }

    img {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
      display: none;
    }

    .field {
      margin-top: 12px;
    }

    .label {
      font-size: 13px;
      color: #777;
    }

    .value {
      font-size: 18px;
      font-weight: 600;
      word-break: break-word;
    }

    #raw {
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
    }

    #progress {
      margin-top: 12px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>OCR етикетки компонента крові</h2>

  <p>
    Сфотографуй етикетку крупним планом,
    максимально рівно і без відблиску.
  </p>

  <input
    type="file"
    id="photo"
    accept="image/*"
    capture="environment">

  <img id="preview">

  <div id="progress">
    Очікую фото
  </div>
</div>


<div class="card">

  <div class="field">
    <div class="label">Компонент</div>
    <div class="value" id="component">—</div>
  </div>

  <div class="field">
    <div class="label">№ / ID дози</div>
    <div class="value" id="doseId">—</div>
  </div>

  <div class="field">
    <div class="label">ABO</div>
    <div class="value" id="abo">—</div>
  </div>

  <div class="field">
    <div class="label">RhD / фенотип</div>
    <div class="value" id="rh">—</div>
  </div>

  <div class="field">
    <div class="label">Дати, знайдені на етикетці</div>
    <div class="value" id="dates">—</div>
  </div>

  <div class="field">
    <div class="label">Обʼєм</div>
    <div class="value" id="volume">—</div>
  </div>

</div>


<div class="card">

  <div class="label">
    Весь розпізнаний текст
  </div>

  <div id="raw">
    —
  </div>

</div>


<script>

const photo =
  document.getElementById("photo");

const preview =
  document.getElementById("preview");


photo.addEventListener("change", async () => {

  if (!photo.files || !photo.files[0]) {
    return;
  }

  const file = photo.files[0];

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

  document.getElementById("progress")
    .textContent =
    "Розпізнаю текст...";

  try {

    const result =
      await Tesseract.recognize(
        file,
        "ukr+eng",
        {
          logger: m => {

            if (
              m.status ===
              "recognizing text"
            ) {

              const percent =
                Math.round(
                  (m.progress || 0) * 100
                );

              document
                .getElementById("progress")
                .textContent =
                "Розпізнавання: " +
                percent +
                "%";
            }

          }
        }
      );

    const text =
      result.data.text || "";

    document
      .getElementById("raw")
      .textContent =
      text;

    parseLabel(text);

    document
      .getElementById("progress")
      .textContent =
      "Готово";

  } catch (e) {

    console.error(e);

    document
      .getElementById("progress")
      .textContent =
      "Помилка OCR: " + e;
  }

});


function parseLabel(text) {

  let clean =
    text
      .replace(/\n+/g, " ")
      .replace(/\s+/g, " ")
      .trim();


  // -----------------------
  // ID дози
  // приклад: 26.01.0199828
  // -----------------------

  let dose =
    clean.match(
      /\b\d{2}\.\d{2}\.\d{6,8}\b/
    );

  document
    .getElementById("doseId")
    .textContent =
    dose ? dose[0] : "—";


  // -----------------------
  // ABO
  // -----------------------

  let abo =
    clean.match(
      /\b(?:AB|A|B|O)\s*\(\s*(?:I|II|III|IV)\s*\)/i
    );

  document
    .getElementById("abo")
    .textContent =
    abo ? abo[0] : "—";


  // -----------------------
  // Дати
  // -----------------------

  let dates =
    clean.match(
      /\b\d{2}\.\d{2}\.\d{4}\b/g
    );

  document
    .getElementById("dates")
    .textContent =
    dates
      ? [...new Set(dates)].join(" ; ")
      : "—";


  // -----------------------
  // Обʼєм
  // -----------------------

  let volume =
    clean.match(
      /\b\d{2,4}\s*(?:ml|мл)\b/i
    );

  document
    .getElementById("volume")
    .textContent =
    volume ? volume[0] : "—";


  // -----------------------
  // Компонент
  // -----------------------

  let component = "—";

  if (/тромбоцит/i.test(clean)) {
    component = "Тромбоцити";
  }

  else if (
    /еритроцит/i.test(clean)
  ) {
    component =
      "Еритроцитарний компонент";
  }

  else if (
    /плазм/i.test(clean)
  ) {
    component = "Плазма";
  }

  else if (
    /кріопрецип/i.test(clean)
  ) {
    component =
      "Кріопреципітат";
  }

  document
    .getElementById("component")
    .textContent =
    component;


  // -----------------------
  // Rh / фенотип
  // -----------------------

  let rh =
    clean.match(
      /\b[CcEeDd]{3,8}\b/
    );

  if (!rh) {

    rh =
      clean.match(
        /Rh[Dd]?\s*[+-]/i
      );
  }

  document
    .getElementById("rh")
    .textContent =
    rh ? rh[0] : "—";
}

</script>

</body>
</html>
