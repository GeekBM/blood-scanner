<script>

let scanner = null;
let running = false;
let lastCode = "";

async function startScanner() {

  if (running) return;

  scanner = new Html5Qrcode("reader");

  const formats = [
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.DATA_MATRIX,
    Html5QrcodeSupportedFormats.QR_CODE
  ];

  const config = {
    fps: 20,

    formatsToSupport: formats,

    qrbox: function(width, height) {
      return {
        width: Math.floor(width * 0.95),
        height: Math.floor(height * 0.55)
      };
    },

    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    }
  };

  try {

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      alert("Камеру не знайдено");
      return;
    }

    // Зазвичай остання камера — основна задня
    const cameraId = cameras[cameras.length - 1].id;

    await scanner.start(
      cameraId,
      config,

      function(decodedText, decodedResult) {

        if (decodedText === lastCode) return;

        lastCode = decodedText;

        document.getElementById("result").textContent =
          decodedText;

        let format = "невідомий";

        try {
          format =
            decodedResult.result.format.formatName;
        } catch (e) {}

        document.getElementById("format").textContent =
          "Формат: " + format;

        if (navigator.vibrate) {
          navigator.vibrate(150);
        }
      },

      function(errorMessage) {
        // Не показуємо помилки кожного невдалого кадру
      }
    );

    running = true;

  } catch (e) {

    alert(
      "Помилка камери:\n\n" +
      e
    );
  }
}

async function stopScanner() {

  if (!scanner || !running) return;

  try {
    await scanner.stop();
    scanner.clear();
  } catch (e) {}

  running = false;
}

</script>
